# Ruff configuration
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "venv",
    "alembic/versions",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top of file
    "E712",  # comparison to True/False (standard SQLAlchemy expression pattern)
    "F401",  # unused imports
    "F841",  # local variable assigned but never used
    "F821",  # forward reference type annotations in SQLAlchemy relationships
    "F541",  # f-string without placeholders
    "W291",  # trailing whitespace
]
