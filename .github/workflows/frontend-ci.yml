name: Frontend CI Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Dependencies, Linting, Testing, and Production Bundle Build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-lint-and-build:
    name: Lint, Test & Build (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Linting (Oxlint)
        run: npm run lint

      - name: Run Tests (if configured)
        run: npm test --if-present

      - name: Build Production Frontend
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend Docker Build & Trivy Vulnerability Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-docker-build:
    name: Docker Build & Trivy Scan (Frontend)
    runs-on: ubuntu-latest
    needs: frontend-lint-and-build
    permissions:
      security-events: write   # Required for uploading SARIF to GitHub Security tab
      actions: read
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t attendance-frontend:${{ github.sha }} \
            -t attendance-frontend:ci \
            ./frontend

      - name: Trivy Container Image Scan (Table Output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "attendance-frontend:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Trivy Container Image Scan — SARIF (Security Tab Upload)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "attendance-frontend:${{ github.sha }}"
          format: "sarif"
          output: "trivy-frontend-results.sarif"

      - name: Upload Trivy SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "trivy-frontend-results.sarif"
          category: "trivy-frontend-container"
