name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Tests & Linting
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests & Linters
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    env:
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET_KEY: "ci-test-secret-key-must-be-32-chars-minimum"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      COMPANY_TIMEZONE: "Asia/Kolkata"
      MIN_OFFICE_DAYS_PER_WEEK: "3"
      MIN_WEEKLY_WORKING_HOURS: "15"
      MIN_AVERAGE_HOURS_PER_DAY: "5"
      EMAIL_MOCK_MODE: "true"
      ATTENDANCE_EVALUATION_DAY: "monday"
      ATTENDANCE_EVALUATION_TIME: "09:00"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v --disable-warnings

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Secret, Dependency & Static Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Static Security Analysis (Bandit SAST)
        run: |
          bandit -r app/ -v

      - name: Dependency Vulnerability Scan (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: SonarCloud Code Quality & Security Analysis
  # ─────────────────────────────────────────────────────────────────────────────
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history required for SonarCloud blame annotations & new-code detection
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & Coverage Tool
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run Tests with Coverage Report
        env:
          DATABASE_URL: "sqlite:///:memory:"
          JWT_SECRET_KEY: "ci-test-secret-key-must-be-32-chars-minimum"
          JWT_ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "60"
          COMPANY_TIMEZONE: "Asia/Kolkata"
          MIN_OFFICE_DAYS_PER_WEEK: "3"
          MIN_WEEKLY_WORKING_HOURS: "15"
          MIN_AVERAGE_HOURS_PER_DAY: "5"
          EMAIL_MOCK_MODE: "true"
          ATTENDANCE_EVALUATION_DAY: "monday"
          ATTENDANCE_EVALUATION_TIME: "09:00"
        run: |
          python -m pytest \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --disable-warnings \
            -v

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Docker Build & Trivy Container Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t attendance-api:ci .

      - name: Trivy Filesystem Scan (Source Code & Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Trivy Container Image Scan (OS + App Vulnerabilities)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "attendance-api:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Trivy Container Image Scan — SARIF (Security Tab Upload)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "image"
          image-ref: "attendance-api:ci"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
