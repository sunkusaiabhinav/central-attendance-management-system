name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests & Linters
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    env:
      DATABASE_URL: "sqlite:///:memory:"
      JWT_SECRET_KEY: "ci-test-secret-key-must-be-32-chars-minimum"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      COMPANY_TIMEZONE: "Asia/Kolkata"
      MIN_OFFICE_DAYS_PER_WEEK: "3"
      MIN_WEEKLY_WORKING_HOURS: "15"
      MIN_AVERAGE_HOURS_PER_DAY: "5"
      EMAIL_MOCK_MODE: "true"
      ATTENDANCE_EVALUATION_DAY: "monday"
      ATTENDANCE_EVALUATION_TIME: "09:00"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v --disable-warnings

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t attendance-api:ci .
