# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud Project Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Required: Match the Organization Key shown in your SonarCloud account
sonar.organization=sunkusaiabhinav

# Required: Unique project key — must match what you create on sonarcloud.io
sonar.projectKey=sunkusaiabhinav_central-attendance-management-system

# Display name shown in SonarCloud dashboard
sonar.projectName=Central Attendance Management System

# ─────────────────────────────────────────────────────────────────────────────
# Source Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Directory containing the application source code to analyse
sonar.sources=app

# Test source directories (excluded from production metrics, but scanned separately)
sonar.tests=tests

# Files/directories to exclude from analysis
sonar.exclusions=**/alembic/**,**/__pycache__/**,**/*.pyc,**/venv/**,**/.venv/**

# ─────────────────────────────────────────────────────────────────────────────
# Coverage Integration
# ─────────────────────────────────────────────────────────────────────────────
# Coverage report produced by: pytest --cov=app --cov-report=xml:coverage.xml
sonar.python.coverage.reportPaths=coverage.xml

# ─────────────────────────────────────────────────────────────────────────────
# Language
# ─────────────────────────────────────────────────────────────────────────────
sonar.language=py
sonar.python.version=3.12
